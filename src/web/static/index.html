<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubFlow AI | Offline Speech & Subtitle Studio</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="brand">
        <div class="logo-icon">🎙️</div>
        <div>
          <h1>SubFlow AI</h1>
          <p class="subtitle" data-i18n="app_subtitle">استودیوی هوشمند رونویسی گفتار و ساخت خودکار زیرنویس</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="langToggleBtn" class="btn btn-secondary">English</button>
      </div>
    </header>

    <main class="main-content">
      <div class="left-panel">
        <div class="card dropzone" id="dropzone">
          <input type="file" id="fileInput" accept="audio/*,video/*" style="display: none;">
          <div class="dropzone-content">
            <div class="upload-icon">📁</div>
            <h3 id="dropText" data-i18n="drop_title">فایل صوتی یا ویدیویی را اینجا رها کنید</h3>
            <p class="muted-text" data-i18n="drop_desc">پشتیبانی از MP3, WAV, MP4, MKV, MOV, FLAC, WebM</p>
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()" data-i18n="btn_select_file">انتخاب فایل...</button>
          </div>
          <div id="fileInfo" class="file-info hidden">
            <div class="file-details">
              <span id="fileName" class="file-name"></span>
              <span id="fileSize" class="file-size"></span>
            </div>
            <button id="removeFileBtn" class="btn-icon">✖</button>
          </div>
        </div>

        <div class="card settings-card">
          <h3 data-i18n="settings_title">تنظیمات هوش مصنوعی و خروجی</h3>
          
          <div class="form-group">
            <label for="modelSelect" data-i18n="model_label">مدل رونویسی (Whisper Model):</label>
            <select id="modelSelect" class="form-control">
              <option value="base" selected id="optModelBase">Base (استاندارد و بالانس - پیشنهادی)</option>
              <option value="tiny" id="optModelTiny">Tiny (فوق‌العاده سریع)</option>
              <option value="small" id="optModelSmall">Small (دقت بالا - کیفیت عالی)</option>
              <option value="medium" id="optModelMedium">Medium (حداکثر دقت)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="langSelect" data-i18n="speech_lang_label">زبان گفتار (Language):</label>
            <select id="langSelect" class="form-control">
              <option value="auto" selected id="optLangAuto">تشخیص خودکار (Auto Detect)</option>
              <option value="fa" id="optLangFa">فارسی (Persian)</option>
              <option value="en" id="optLangEn">انگلیسی (English)</option>
              <option value="ar" id="optLangAr">عربی (Arabic)</option>
              <option value="fr" id="optLangFr">فرانسوی (French)</option>
              <option value="de" id="optLangDe">آلمانی (German)</option>
              <option value="es" id="optLangEs">اسپانیایی (Spanish)</option>
              <option value="tr" id="optLangTr">ترکی (Turkish)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="formatSelect" data-i18n="sub_fmt_label">فرمت خروجی زیرنویس:</label>
            <select id="formatSelect" class="form-control">
              <option value="srt" selected id="optFmtSrt">SRT (استاندارد پلیرها و یوتیوب)</option>
              <option value="vtt" id="optFmtVtt">VTT (استاندارد صفحات وب HTML5)</option>
              <option value="ass" id="optFmtAss">ASS (زیرنویس پیشرفته با استایل)</option>
              <option value="txt" id="optFmtTxt">TXT (متن ساده پیوسته)</option>
              <option value="json" id="optFmtJson">JSON (متادیتای کامل زمان‌بندی)</option>
            </select>
          </div>

          <div class="form-check">
            <input type="checkbox" id="chkVad" checked>
            <label for="chkVad" data-i18n="chk_vad">فیلتر سکوت و تشخیص صدای انسان (VAD Filter)</label>
          </div>

          <button id="startBtn" class="btn btn-success btn-block" disabled data-i18n="btn_start">شروع رونویسی و ساخت زیرنویس</button>
        </div>
      </div>

      <div class="right-panel">
        <div class="card preview-card">
          <div class="preview-header">
            <h3 data-i18n="preview_title">پیش‌نمایش متن و زیرنویس تولید شده</h3>
            <div class="preview-actions">
              <button id="copyBtn" class="btn btn-secondary btn-sm" disabled data-i18n="btn_copy">کپی متن</button>
              <button id="downloadBtn" class="btn btn-primary btn-sm" disabled data-i18n="btn_download">دانلود فایل زیرنویس</button>
            </div>
          </div>
          <div class="editor-wrapper">
            <textarea id="previewText" placeholder="متن یا زیرنویس تولید شده پس از رونویسی در اینجا نمایش داده می‌شود..."></textarea>
          </div>
          <div id="statusAlert" class="status-alert hidden">
            <div class="spinner"></div>
            <span id="statusMsg" data-i18n="status_ready">در حال رونویسی هوشمند فایل...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
